global
        log /dev/log    local0
        log /dev/log    local1 notice
        chroot /var/lib/haproxy
        stats socket /run/haproxy/admin.sock mode 660 level admin
        stats timeout 30s
        user haproxy
        group haproxy
        daemon

        # Default SSL material locations
#        ca-base /etc/ssl/certs
#        crt-base /etc/ssl/private

        # See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.>
#        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128>
#        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SH>
#        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
        log     global
        mode    http
        option  httplog
        option  dontlognull
        timeout connect 5000
        timeout client  50000
        timeout server  50000
        errorfile 400 /etc/haproxy/errors/400.http
        errorfile 403 /etc/haproxy/errors/403.http
        errorfile 408 /etc/haproxy/errors/408.http
        errorfile 500 /etc/haproxy/errors/500.http
        errorfile 502 /etc/haproxy/errors/502.http
        errorfile 503 /etc/haproxy/errors/503.http
        errorfile 504 /etc/haproxy/errors/504.http

frontend http-in
    bind *:80
    mode http
    option httplog
#    acl pve_http_frontend hdr(host) -i pve.homelab.lan
#    acl vault_http_frontend hdr(host) -i vault.homelab.lan
#    acl consul_http_frontend hdr(host) -i consul.homelab.lan
#    use_backend proxmox_webui_backend if pve_http_frontend
#    use_backend consul_backend if consul_http_frontend
#    use_backend vault_backend if vault_http_frontend
    default_backend no_route

backend no_route
    mode http
    # We can use a built-in HAProxy "errorfile" or a custom file
    errorfile 503 /etc/haproxy/errors/503.http


# This rule needed to be crafted on cloudflare:
# - First needed to log into cloudflare and navigate over to the 'Rules' tab
# - Then needed to add an origin rule to forward this request using port 8443
# - Finally, needed to add a 'Request Header Transform Rule' to add the SNI header:
#   - Set static X-Forwarded-SNI = plex.rc-server.com
# - This allows a tcp backend for plex that fixes issues presented with http overhead
frontend plex-cf-in
    bind *:8443 ssl crt /etc/haproxy/certs
    mode tcp
    tcp-request inspect-delay 300ms
    tcp-request content accept if { req_ssl_hello_type 1 }
    acl is_plex req.hdr(X-Forwarded-SNI) -i plex.rc-server.com
    use_backend plex_backend if is_plex
    default_backend no_route

frontend https-in
    bind *:443 ssl crt /etc/haproxy/certs
    mode http
    # Frontends
    acl proxmox_web hdr(host) -i proxmox.homelab.lan
    acl vault_frontend hdr(host) -i vault.homelab.lan
    acl consul_frontend hdr(host) -i consul.homelab.lan
#    acl plex_frontend hdr(host) -i plex.rc-server.com
    acl nas_ui_frontend hdr(host) -i nas.homelab.lan
    acl pfsense_frontend hdr(host) -i pfsense.homelab.lan
    # Backends
    use_backend vault_backend if vault_frontend
    use_backend consul_backend if consul_frontend
    use_backend proxmox_webui_backend if proxmox_web
#    use_backend plex_backend if plex_frontend
    use_backend nas_ui_backend if nas_ui_frontend
    use_backend pfsense_backend if pfsense_frontend
    # Default Backend
    default_backend truenas_backend

backend truenas_backend
    mode http
    server TrueNas 10.243.0.4:443

backend nas_ui_backend
    mode http
    server TrueNas 10.243.0.4:444 ssl crt /etc/haproxy/certs/nas.pem verify required ca-file /etc/haproxy/ca/pki-tn-chain.pem

backend pfsense_backend
    mode http
    server pfsense 10.10.10.1:4443 ssl crt /etc/haproxy/certs/pfsense.pem verify required ca-file /etc/haproxy/ca/pki-pfsense-chain.pem

backend plex_backend
    mode tcp
    server TrueNas 10.243.0.4:32400

backend proxmox_webui_backend
    mode http
    option httpchk basic
    server pveHost 10.243.0.3:8006 ssl crt /etc/haproxy/certs/pveHost.pem verify required ca-file /etc/haproxy/ca/pki-lb-chain.pem

backend vault_backend
    mode http
    balance roundrobin
    option httpchk GET /v1/sys/health
    server vault-01 192.168.20.6:8200 check ssl verify required ca-file /etc/haproxy/ca/pki-vault-chain.pem
    server vault-02 192.168.20.7:8200 check ssl verify required ca-file /etc/haproxy/ca/pki-vault-chain.pem
    server vault-03 192.168.20.8:8200 check ssl verify required ca-file /etc/haproxy/ca/pki-vault-chain.pem

backend consul_backend
    mode http
    balance roundrobin
    option httpchk GET /v1/status/leader
    server consul-01 192.168.20.9:8501 check ssl verify required ca-file /etc/haproxy/ca/pki-consul-chain.pem crt /etc/haproxy/ca/pki-lb-chain.pem
    server consul-02 192.168.20.10:8501 check ssl verify required ca-file /etc/haproxy/ca/pki-consul-chain.pem crt /etc/haproxy/ca/pki-lb-chain.pem
    server consul-03 192.168.20.11:8501 check ssl verify required ca-file /etc/haproxy/ca/pki-consul-chain.pem crt /etc/haproxy/ca/pki-lb-chain.pem